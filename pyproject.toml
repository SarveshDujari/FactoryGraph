[project]
name = "factory-graph"
version = "0.1.0"
description = "Graph-grounded factory disruption recovery with human approval"
requires-python = ">=3.11"
dependencies = ["falkordb>=1.2,<2", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real FalkorDB server"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".uv-clean"]

[tool.ruff.lint.per-file-ignores]
"tests/test_upgrade.py" = ["F811"]
